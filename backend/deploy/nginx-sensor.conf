# ============================================================================
#  nginx 反向代理配置 —— 给传感器服务加 HTTPS
#  安装位置: /etc/nginx/sites-available/sensor-ingest  (再软链到 sites-enabled)
#
#  为什么建议上 HTTPS：
#    固件用 https:// 时会启用 TLS 证书校验（ESP-IDF 内置根证书包），
#    设备令牌与传感数据不会被明文传输。
#
#  申请证书（最省事的方式，自动续期）：
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d your-domain.example.com
#    certbot 会自动改写本文件里的 ssl_certificate 路径。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;      # ← 改成你的域名

    # 证书申请阶段先放行 80；申请完 certbot 会自动加上跳转
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.example.com;      # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传报文很小（约 0.7KB），限制请求体大小即可
    client_max_body_size 64k;

    access_log /var/log/nginx/sensor-ingest.access.log;
    error_log  /var/log/nginx/sensor-ingest.error.log;

    # 反向代理到本机 8000 端口的 sensor-ingest 服务
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 网页是 2 秒轮询一次，禁掉代理缓存，保证看到的是最新真实数据
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }
}