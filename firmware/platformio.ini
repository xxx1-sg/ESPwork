; ============================================================================
;  platformio.ini —— ESP32-S3-EYE 真实物理传感器采集固件
;  ---------------------------------------------------------------------------
;  开发板 : ESP32-S3-EYE (ESP32-S3-WROOM-1-N8R8, 8MB Flash + 8MB PSRAM)
;  传感器 : 板载 QMA6100P 三轴加速度计 (I2C 地址 0x12, SDA=GPIO4, SCL=GPIO5)
;  框架   : ESP-IDF (PlatformIO 的 espidf 框架, 编译产物与官方 idf.py 一致)
;
;  常用命令:
;    pio run                 # 只编译
;    pio run -t upload       # 编译并烧录 (USB 仅作调试排错通道)
;    pio device monitor      # 打开串口查看硬件实测值
; ============================================================================

[env:esp32s3eye]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = espidf

; ---- Flash 配置: ESP32-S3-EYE 板载 8MB Flash ----
board_build.flash_size  = 8MB
board_upload.flash_size = 8MB
board_build.f_flash     = 80000000L

; ---- 分区表 ----
; 注意: PlatformIO 生成分区表用的是本选项（默认取 IDF 的 partitions_singleapp.csv，
; 只给应用分区 1MB）。必须显式指向工程自带的 partitions.csv，应用分区才是 4MB。
board_build.partitions = partitions.csv

; ---- 串口: 板子通过原生 USB(USB-Serial-JTAG) 接到电脑, 实测为 COM5 ----
; 该通道只用于烧录/看日志排错, 正式数据上传一律走 Wi-Fi, 符合任务要求。
upload_port  = COM5
monitor_port = COM5
monitor_speed = 115200
monitor_filters = time, colorize, esp32_exception_decoder

; ---- 编译选项 ----
; 告警照常打印，但不因为告警中断编译
;   ★ APP_CONFIG_USE_LOCAL：启用 firmware/src/app_config.local.h 里的本地私密配置
;     （真实 Wi-Fi SSID/密码）。该文件已在 .gitignore 中，**不会进版本库**；
;     换机器/换网络时只改那一个文件，不用动 app_config.h。
build_flags =
    -D CONFIG_APP_PROJECT_VER=\"1.0.0\"
    -D APP_CONFIG_USE_LOCAL=1
    -Wall
    -Wextra
    -Wno-error

; 使用工程自带的 sdkconfig.defaults (含 USB-Serial-JTAG 控制台、证书包等开关)
board_build.sdkconfig_defaults = sdkconfig.defaults